[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/"]
solc_version = "0.8.34"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[fmt]
ignore = ["src/interfaces/IPersonhood.sol", "src/interfaces/ISystem.sol", "src/interfaces/IXcm.sol"]
