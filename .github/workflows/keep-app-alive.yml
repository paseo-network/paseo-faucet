name: Keep app alive

# Bulletin drops stored data after 14 days, and a deploy re-uses blocks that are already stored, so
# the app expires unless its blocks are stored again. Every day this checks the latest `app/*`
# release against the chain and, once its oldest block is 13 days old or one is missing, stores
# every archived block again with the account the deploy stored with. Storage authorizations last
# 14 days too: first it extends that account's once fewer than 3 days are left.
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Store every block now, whatever its age
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: app-on-bulletin
  cancel-in-progress: false

jobs:
  keep-alive:
    name: Keep alive
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: paseo
    env:
      PRODUCT_ID: ${{ vars.PRODUCT_ID }}
    steps:
      - name: Check settings
        env:
          MNEMONIC: ${{ secrets.MNEMONIC }}
          BULLETIN_AUTHORIZER: ${{ secrets.BULLETIN_AUTHORIZER }}
        run: |
          missing=""
          for name in PRODUCT_ID MNEMONIC BULLETIN_AUTHORIZER; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::set these on the paseo environment:$missing"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/package-lock.json

      - name: Install the deploy tooling
        working-directory: deploy
        run: npm ci

      - name: Keep the storage authorization
        working-directory: deploy
        env:
          MNEMONIC: ${{ secrets.MNEMONIC }}
          BULLETIN_AUTHORIZER: ${{ secrets.BULLETIN_AUTHORIZER }}
        run: npx tsx keepalive.ts authorize

      - name: Download the latest app archive
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("app/"))] | sort_by(.publishedAt) | last | .tagName // empty')
          if [ -z "$TAG" ]; then
            echo "::notice::there is no app/* release yet; run Deploy app first"
            exit 0
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern app.car --dir "$RUNNER_TEMP"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Store the blocks again when due
        if: steps.release.outputs.tag != ''
        working-directory: deploy
        env:
          MNEMONIC: ${{ secrets.MNEMONIC }}
          FORCE: ${{ inputs.force }}
        run: |
          args=(restore --name "$PRODUCT_ID" --car "$RUNNER_TEMP/app.car")
          if [ "$FORCE" = true ]; then args+=(--force); fi
          npx tsx keepalive.ts "${args[@]}"
