name: Deploy app

# Publishes frontend/ from main under the DotNS name PRODUCT_ID on the PCF devnet (names on Paseo
# Asset Hub, storage on Bulletin 1010) with polkadot-app-deploy, as getcash does. It then archives
# exactly the blocks the name points at and releases the archive as `app/<YYYY-MM-DD>.<n>`;
# keep-app-alive.yml stores those blocks again before Bulletin drops them.
on:
  workflow_dispatch:

permissions:
  contents: read

# Every deploy and keep-alive pass signs with the operator account: runs queue, never overlap, and
# are never cancelled midway.
concurrency:
  group: operator
  cancel-in-progress: false

env:
  ETH_RPC: https://eth-rpc-testnet.polkadot.io

jobs:
  deploy:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: paseo
    outputs:
      name: ${{ vars.PRODUCT_ID }}
      root: ${{ steps.archive.outputs.root }}
    env:
      PRODUCT_ID: ${{ vars.PRODUCT_ID }}
      FAUCET_ADDRESS: ${{ vars.FAUCET_ADDRESS }}
    steps:
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::app deploys run only from main"
            exit 1
          fi

      - name: Check settings
        env:
          MNEMONIC: ${{ secrets.MNEMONIC }}
          BULLETIN_AUTHORIZER: ${{ secrets.BULLETIN_AUTHORIZER }}
        run: |
          missing=""
          for name in PRODUCT_ID FAUCET_ADDRESS MNEMONIC BULLETIN_AUTHORIZER; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::set these on the paseo environment:$missing"
            exit 1
          fi
          if [[ ! "$FAUCET_ADDRESS" =~ ^0x[0-9a-fA-F]{40}$ ]]; then
            echo "::error::FAUCET_ADDRESS is not an address"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.5

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            deploy/package-lock.json

      - name: Check the faucet contract
        run: |
          product=$(cast call "$FAUCET_ADDRESS" 'productId()(string)' --rpc-url "$ETH_RPC")
          domain=$(cast call "$FAUCET_ADDRESS" 'DOMAIN()(bytes15)' --rpc-url "$ETH_RPC")
          if [ "$product" != "\"$PRODUCT_ID\"" ] || [ "$domain" != 0x706173656f2d6661756365743a7632 ]; then
            echo "::error::$FAUCET_ADDRESS is not a paseo-faucet:v2 contract for $PRODUCT_ID (productId $product, DOMAIN $domain)"
            exit 1
          fi

      - name: Build
        working-directory: frontend
        env:
          VITE_FAUCET_ADDRESS: ${{ vars.FAUCET_ADDRESS }}
          VITE_PRODUCT_ID: ${{ vars.PRODUCT_ID }}
        run: |
          npm ci
          npm run build

      - name: Install the deploy tooling
        working-directory: deploy
        run: npm ci

      - name: Keep the storage authorization
        working-directory: deploy
        env:
          MNEMONIC: ${{ secrets.MNEMONIC }}
          BULLETIN_AUTHORIZER: ${{ secrets.BULLETIN_AUTHORIZER }}
        run: npx tsx keepalive.ts authorize

      # The wrapper exits 75 on transient failures only (a nonce race, a dropped connection); only
      # those are retried.
      - name: Publish
        env:
          MNEMONIC: ${{ secrets.MNEMONIC }}
          PAD_TELEMETRY: "0"
          PAD_UPDATE_CHECK: "0"
          DO_NOT_TRACK: "1"
        run: |
          npm install -g @polkadot-community-foundation/polkadot-app-deploy@0.16.7
          wrapper="$(npm root -g)/@polkadot-community-foundation/polkadot-app-deploy/tools/release-retry-wrapper.mjs"
          for attempt in 1 2 3; do
            status=0
            node "$wrapper" polkadot-app-deploy frontend/dist "$PRODUCT_ID" --env devnet --js-merkle --content-only || status=$?
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$status" -ne 75 ] || [ "$attempt" -eq 3 ]; then exit "$status"; fi
            echo "::warning::attempt $attempt failed transiently; retrying"
            sleep 30
          done

      - name: Archive what the name points at
        id: archive
        working-directory: deploy
        run: npx tsx keepalive.ts archive --name "$PRODUCT_ID" --car "$RUNNER_TEMP/app.car"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-archive
          path: ${{ runner.temp }}/app.car
          retention-days: 7

  release:
    needs: deploy
    name: Release the archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-archive
          path: archive

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.deploy.outputs.name }}
          ROOT: ${{ needs.deploy.outputs.root }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          LAST=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/app/$DATE." --jq '.[].ref' \
            | sed -n "s#^refs/tags/app/$DATE\.\([0-9]*\)\$#\1#p" | sort -n | tail -1)
          TAG="app/$DATE.$(( ${LAST:-0} + 1 ))"
          gh release create "$TAG" archive/app.car --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" \
            --notes "The app published under \`$NAME\` at \`$ROOT\` by run $GITHUB_RUN_ID. \`app.car\` holds every block the name points at; keep-app-alive.yml stores them again before Bulletin drops them."
          echo "### Released \`$TAG\` at ${GITHUB_SHA:0:8}, root \`$ROOT\`" >> "$GITHUB_STEP_SUMMARY"
