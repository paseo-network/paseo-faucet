endpoint:
  - wss://rpc.interweb-it.com/people-paseo
  - wss://people-paseo.gatotech.network
  - wss://people-paseo.rotko.net
# Set PEOPLE_BLOCK to pin the fork; unset forks the latest block.
block: ${env.PEOPLE_BLOCK}
